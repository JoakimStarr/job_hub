# ============================================
# FinIntern Hub - Docker 多阶段构建
# ============================================
#
# 使用方式:
#   docker compose up -d          # 启动所有服务
#   docker compose logs -f web    # 查看Web日志
#   docker compose exec spider python3 src/spiders/run.py --sources sufe  # 运行爬虫
#
# ============================================

services:
  # ====================
  # Web 应用 (Next.js)
  # ====================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NODE_ENV=production
    container_name: job-hub-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/jobs.db
      - SESSION_TIMEOUT_HOURS=24
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    networks:
      - job-hub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ====================
  # Nginx 反向代理
  # ====================
  nginx:
    image: nginx:alpine
    container_name: job-hub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - job-hub-network

  # ====================
  # 爬虫执行器 (按需启动)
  # ====================
  spider:
    build:
      context: .
      dockerfile: Dockerfile.spider
    container_name: job-hub-spider
    profiles:
      - spider  # 默认不启动，使用 --profile spider 启动
    environment:
      - DATABASE_PATH=/app/data/jobs.db
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    networks:
      - job-hub-network
    command: ["python3", "src/spiders/run.py", "--sources", "sufe,zuel,cufe,dufe,swufe"]

networks:
  job-hub-network:
    driver: bridge

volumes:
  certbot-conf:
  certbot-www:
