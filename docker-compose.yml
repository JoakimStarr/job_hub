# ============================================
# FinIntern Hub - Docker Compose 配置
# ============================================
#
# 使用方式:
#   docker compose up -d          # 启动服务
#   docker compose logs -f        # 查看日志
#   docker compose down           # 停止服务
#
# 认证说明:
#   - 使用数据库用户认证 (替代环境变量TOKEN)
#   - 首次运行需初始化默认用户: npx ts-node scripts/init-default-users.ts
#   - 默认账号: admin/admin123, operator/operator123, viewer/viewer123
#
# ============================================

services:
  # ====================
  # Next.js Web 应用
  # ====================
  finintern-next:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: job-hub
    restart: unless-stopped
    ports:
      - "${NEXT_APP_PORT:-3001}:3000"
    environment:
      # 基础配置
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      
      # 数据库路径
      DATABASE_PATH: /app/data/jobs.db
      
      # 会话配置 (不再使用环境变量TOKEN)
      SESSION_TIMEOUT_HOURS: ${SESSION_TIMEOUT_HOURS:-24}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      
      # AI服务配置 (可选)
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      
    volumes:
      # 数据持久化
      - ./data:/app/data
      - ./log:/app/log
      - ./output:/app/output
      
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 可选: 使用外部网络
# networks:
#   default:
#     external:
#       name: job-hub-network
