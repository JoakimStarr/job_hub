services:
  finintern-next:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "${NEXT_APP_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NODE_ENV: production
      ADMIN_TOKEN: ${ADMIN_TOKEN:-finintern-admin-2024}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-finintern-operator-2024}
      VIEWER_TOKEN: ${VIEWER_TOKEN:-finintern-viewer-2024}
      AUTH_SALT: ${AUTH_SALT:-finintern-hub-salt-v1}
    volumes:
      - ./data:/app/data
      - ./log:/app/log
      - ./output:/app/output
    restart: unless-stopped
